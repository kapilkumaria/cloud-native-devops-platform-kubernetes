apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-platform-app
  namespace: argocd
spec:
  project: cloud-platform

  source:
    repoURL: https://github.com/kapilkumaria/cloud-native-devops-platform-kubernetes.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: cloud-platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
